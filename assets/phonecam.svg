<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cyber Cyan to Electric Indigo Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Secondary Cyan/Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Lens Deep Core Gradient -->
    <radialGradient id="lensCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="45%" stop-color="#0C4A6E" />
      <stop offset="85%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- 1. Base Squircle Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" filter="url(#iconShadow)" />

  <!-- 2. Cyber Orbit Rings (Virtual Webcam Stream Broadcast) -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="156" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5" />

  <!-- Radiating Broadcast Waves (Left & Right) -->
  <path d="M 112 212 A 160 160 0 0 0 112 300" fill="none" stroke="url(#cyberGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 80 188 A 200 200 0 0 0 80 324" fill="none" stroke="url(#cyberGrad)" stroke-width="4" stroke-linecap="round" opacity="0.5" />

  <path d="M 400 212 A 160 160 0 0 1 400 300" fill="none" stroke="url(#cyberGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 432 188 A 200 200 0 0 1 432 324" fill="none" stroke="url(#cyberGrad)" stroke-width="4" stroke-linecap="round" opacity="0.5" />

  <!-- 3. Stylized Geometric Smartphone Body -->
  <!-- Outer Phone Shell -->
  <rect x="156" y="80" width="200" height="352" rx="38" fill="#090D16" stroke="url(#cyberGrad)" stroke-width="5" />

  <!-- Inner Phone Screen Area -->
  <rect x="168" y="104" width="176" height="304" rx="26" fill="#0F172A" stroke="#1E293B" stroke-width="2" />

  <!-- Phone Speaker / Dynamic Island -->
  <rect x="226" y="92" width="60" height="6" rx="3" fill="#334155" />

  <!-- Bottom Home Indicator Line -->
  <rect x="232" y="394" width="48" height="4" rx="2" fill="#334155" />

  <!-- 4. Studio Webcam Camera Lens (Hero Centerpiece) -->
  <!-- Outer Bezel Ring -->
  <circle cx="256" cy="256" r="92" fill="#090D16" stroke="#1E293B" stroke-width="6" />

  <!-- Vivid Gradient Aperture Ring -->
  <circle cx="256" cy="256" r="82" fill="none" stroke="url(#cyberGrad)" stroke-width="6" />

  <!-- Inner Metallic Bezel -->
  <circle cx="256" cy="256" r="70" fill="#0F172A" stroke="#334155" stroke-width="3" />

  <!-- Lens Core Optics -->
  <circle cx="256" cy="256" r="60" fill="url(#lensCore)" />

  <!-- Aperture Iris Geometric Triangles/Blades -->
  <polygon points="256,206 276,236 246,230" fill="#0284C7" opacity="0.5" />
  <polygon points="296,236 286,268 266,250" fill="#38BDF8" opacity="0.5" />
  <polygon points="280,286 250,286 260,262" fill="#00F2FE" opacity="0.6" />
  <polygon points="230,286 220,256 244,264" fill="#0284C7" opacity="0.5" />
  <polygon points="216,236 246,236 232,254" fill="#00F2FE" opacity="0.6" />

  <!-- Lens Glass Light Reflection Glare -->
  <ellipse cx="236" cy="234" rx="26" ry="13" transform="rotate(-38 236 234)" fill="#FFFFFF" opacity="0.45" />
  <circle cx="276" cy="274" r="7" fill="#00F2FE" opacity="0.75" />

  <!-- 5. Live Streaming UVC Indicator Dot -->
  <circle cx="256" cy="136" r="6" fill="#00F2FE" />
  <circle cx="256" cy="136" r="12" fill="#00F2FE" opacity="0.25" />
</svg>
