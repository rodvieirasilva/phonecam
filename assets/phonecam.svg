<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <linearGradient id="lensGlass" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Outer Phone Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FACC15" stop-opacity="0" />
      <stop offset="95%" stop-color="#FACC15" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Canvas (Squircle / Rounded App Icon) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#27272A" stroke-width="4" filter="url(#dropShadow)"/>

  <!-- Subtle grid/aperture radial lines in background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#27272A" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Phone Body Outline -->
  <rect x="156" y="80" width="200" height="352" rx="36" fill="#18181B" stroke="#3F3F46" stroke-width="6"/>

  <!-- Phone Screen Display (dark gradient) -->
  <rect x="168" y="104" width="176" height="304" rx="24" fill="#09090B" stroke="#27272A" stroke-width="2"/>

  <!-- Phone Top Speaker / Notch -->
  <rect x="228" y="92" width="56" height="6" rx="3" fill="#52525B" />

  <!-- Camera Aperture / Webcam Lens (Hero Focal Point) -->
  <!-- Outer metallic bezel -->
  <circle cx="256" cy="256" r="92" fill="#27272A" stroke="url(#accentGrad)" stroke-width="6" />

  <!-- Secondary inner rim -->
  <circle cx="256" cy="256" r="76" fill="#18181B" stroke="#3F3F46" stroke-width="3" />

  <!-- Deep optics glass -->
  <circle cx="256" cy="256" r="64" fill="url(#lensGlass)" />

  <!-- Lens reflection glare -->
  <ellipse cx="236" cy="236" rx="28" ry="14" transform="rotate(-35 236 236)" fill="#FFFFFF" opacity="0.4" />
  <circle cx="272" cy="272" r="8" fill="#38BDF8" opacity="0.6" />

  <!-- Signal / Broadcast Waves (Representing virtual webcam loopback stream) -->
  <path d="M 120 220 A 150 150 0 0 0 120 292" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M 88 196 A 190 190 0 0 0 88 316" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

  <path d="M 392 220 A 150 150 0 0 1 392 292" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M 424 196 A 190 190 0 0 1 424 316" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

  <!-- Live Status LED Indicator -->
  <circle cx="256" cy="140" r="7" fill="#10B981" />
  <circle cx="256" cy="140" r="14" fill="#10B981" opacity="0.25" />
</svg>
