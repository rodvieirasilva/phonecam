name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Package (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libgtk-4-dev libadwaita-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release Assets
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCHIVE="phonecam-${TAG_NAME}-${{ matrix.arch }}-linux.tar.gz"
          
          mkdir -p dist/package/ui
          cp target/release/phonecam dist/package/
          cp -f src/ui/Main.qml dist/package/ui/
          cp -r assets dist/package/
          cp -r pkgbuild dist/package/
          cp -r scripts dist/package/
          cp config.example.toml dist/package/
          cp README.md dist/package/
          cp AGENTS.md dist/package/
          cp LICENSE dist/package/

          tar -czvf "${ARCHIVE}" -C dist/package .
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

          mkdir -p artifacts
          mv "${ARCHIVE}" artifacts/
          mv "${ARCHIVE}.sha256" artifacts/

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets

      - name: List Release Files
        run: ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/phonecam-*.tar.gz
            release-assets/phonecam-*.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
