name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qttest qt6-declarative-dev qt6-declarative-dev-tools libv4l-dev ffmpeg desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Format Check (rustfmt)
        run: cargo fmt --check

      - name: Rust Linter (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Full Unit & Integration Test Suite
        run: cargo test --all-targets

      - name: Run Fake Phone E2E Test Suite
        run: cargo test --test fake_phone_e2e

      - name: Run Qt Quick UI Click & TestID Simulation Suite
        run: ./tests/test-ui.sh

      - name: Run CLI & Asset E2E Test Suite
        run: ./tests/test-e2e.sh

      - name: Test Coverage (cargo-llvm-cov)
        run: cargo llvm-cov --all-targets --summary-only

      - name: Build Release Binary
        run: cargo build --release
