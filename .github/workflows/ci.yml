name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qttest qt6-declarative-dev qt6-declarative-dev-tools libv4l-dev ffmpeg desktop-file-utils imagemagick tesseract-ocr tesseract-ocr-eng v4l2loopback-dkms
          sudo modprobe v4l2loopback video_nr=10 card_label="PhoneCam Virtual Camera" exclusive_caps=1 || true
          sudo chmod 666 /dev/video10 2>/dev/null || true
          echo "$USER ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/phonecam-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Format Check (rustfmt)
        run: cargo fmt --check

      - name: Rust Linter (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Release Binary (x86_64)
        run: cargo build --release

      - name: Build ARM64 Binary (aarch64)
        run: |
          rustup target add aarch64-unknown-linux-musl
          RUSTFLAGS="-C linker=rust-lld" cargo build --target aarch64-unknown-linux-musl --release --no-default-features

      - name: Run Full Unit & Integration Test Suite
        run: cargo test --all-targets

      - name: Run Fake Phone E2E Test Suite
        run: cargo test --test fake_phone_e2e

      - name: Run Native GTK4 & UI Simulation Suite
        run: ./tests/test-ui.sh

      - name: Run Terminal TUI Dashboard E2E
        run: ./tests/test-tui-e2e.sh

      - name: Run Hardware OCR Video Stream E2E Verification
        run: ./tests/test-ocr-e2e.sh

      - name: Run Performance, Memory, CPU & Teardown E2E
        run: ./tests/test-perf-e2e.sh

      - name: Run CLI & Asset E2E Test Suite
        run: ./tests/test-e2e.sh

      - name: Test Coverage (cargo-llvm-cov)
        run: cargo llvm-cov --all-targets --summary-only
