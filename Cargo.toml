[package]
name = "phonecam"
version = "0.1.0"
edition = "2024"
authors = ["Rodrigo Vieira <rodvieirasilva@gmail.com>"]
description = "High-performance smartphone webcam virtual device manager for Omarchy Linux"
license = "MIT"

[lib]
name = "phonecam"
path = "src/lib.rs"

[[bin]]
name = "phonecam"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8.9" }
tower-http = { version = "0.7", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7.0"
libc = "0.2"
gtk4 = { version = "0.9", optional = true }
adw = { version = "0.7", package = "libadwaita", optional = true }

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:adw"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
